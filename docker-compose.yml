services:
  postgres:
    image: postgres:16-alpine
    container_name: binomo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binomo
      POSTGRES_PASSWORD: binomo
      POSTGRES_DB: binomo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binomo -d binomo']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://binomo:binomo@postgres:5432/binomo?schema=public
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
