packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ exige aprobar explícitamente los scripts de instalación.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  '@scarf/scarf': false
  argon2: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  - 'unrs-resolver'
  - 'argon2'

enablePrePostScripts: false

minimumReleaseAgeExclude:
  - fast-check@4.11.0
